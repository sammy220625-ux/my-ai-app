<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#2563EB">

  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #2563EB;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #2563EB;
      color: white;
    }

    .ai {
      margin-right: auto;
      background: #e5e7eb;
      color: #111827;
    }

    .welcome {
      text-align: center;
      color: #6b7280;
      margin-top: 40px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #2563EB;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    🤖 My AI Assistant
  </header>

  <div id="chat">

    <div class="welcome">
      <h2>สวัสดีครับ 👋</h2>
      <p>ผมคือ AI Assistant ของคุณ</p>
      <p>พิมพ์ข้อความด้านล่างเพื่อเริ่มสนทนา</p>
    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="พิมพ์ข้อความ..."
      autocomplete="off"
    >

    <button id="sendButton">
      ส่ง
    </button>

  </div>

</div>

<script>

const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const chat = document.getElementById("chat");

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  input.value = "";

  button.disabled = true;

  addMessage(text, "user");

  const aiMessage = addMessage(
    "กำลังคิด... 🤔",
    "ai"
  );

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
      );
    }

    aiMessage.textContent =
      data.reply || "AI ไม่มีคำตอบ";

  } catch (error) {

    console.error(error);

    aiMessage.textContent =
      "❌ " + error.message;

  } finally {

    button.disabled = false;

    input.focus();

  }
}

button.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }

  }
);

</script>
</body>
</html>
