
<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

  <meta name="theme-color" content="#2563EB">

  <title>My AI Assistant</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 600px;
      height: 100dvh;
      margin: auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    header {
      background: #2563EB;
      color: white;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      color: #2563EB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 17px;
      font-weight: bold;
    }

    .header-status {
      font-size: 12px;
      opacity: .85;
      margin-top: 2px;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .clear-button {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: white;
      font-size: 19px;
      cursor: pointer;
      border-radius: 50%;
    }

    .clear-button:active {
      background: rgba(255,255,255,.18);
    }

    /* ================= AI MODE ================= */

    .mode-area {
      margin-top: 9px;
    }

    .mode-select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      background: rgba(255,255,255,.15);
      color: white;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .mode-select option {
      background: white;
      color: #111827;
    }

    /* ================= CHAT ================= */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 20px;
      scroll-behavior: smooth;
      background: #f8fafc;
    }

    #chat::-webkit-scrollbar {
      width: 4px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    /* ================= WELCOME ================= */

    .welcome {
      text-align: center;
      padding: 42px 20px 30px;
      color: #64748b;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #2563EB;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(37,99,235,.25);
    }

    .welcome h2 {
      margin: 0 0 8px;
      color: #111827;
      font-size: 22px;
    }

    .welcome p {
      margin: 5px 0;
      font-size: 14px;
    }

    /* ================= MESSAGE ================= */

    .message-row {
      display: flex;
      margin-bottom: 14px;
      align-items: flex-end;
      gap: 8px;
    }

    .user-row {
      justify-content: flex-end;
    }

    .ai-row {
      justify-content: flex-start;
    }

    .small-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #2563EB;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message {
      max-width: 78%;
      padding: 11px 14px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      background: #2563EB;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.ai {
      background: white;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }

    /* ================= INPUT ================= */

    .input-area {
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      min-width: 0;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 14px;
    }

    #messageInput {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 12px 0;
      font-size: 16px;
      color: #111827;
    }

    #messageInput::placeholder {
      color: #94a3b8;
    }

    #sendButton {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border: none;
      border-radius: 50%;
      background: #2563EB;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37,99,235,.25);
    }

    #sendButton:active {
      transform: scale(.94);
    }

    #sendButton:disabled {
      background: #94a3b8;
      box-shadow: none;
    }

    /* ================= DARK MODE ================= */

    body.dark {
      background: #111827;
    }

    body.dark .app {
      background: #111827;
    }

    body.dark #chat {
      background: #0f172a;
    }

    body.dark .message.ai {
      background: #1e293b;
      color: #f1f5f9;
      border-color: #334155;
    }

    body.dark .input-area {
      background: #111827;
      border-color: #334155;
    }

    body.dark .input-box {
      background: #1e293b;
      border-color: #334155;
    }

    body.dark #messageInput {
      color: #f1f5f9;
    }

    body.dark #messageInput::placeholder {
      color: #94a3b8;
    }

    body.dark .welcome {
      color: #94a3b8;
    }

    body.dark .welcome h2 {
      color: #f8fafc;
    }

    /* ================= DESKTOP ================= */

    @media (min-width: 601px) {

      body {
        display: flex;
        justify-content: center;
      }

      .app {
        box-shadow: 0 0 30px rgba(0,0,0,.08);
      }

    }

  </style>

</head>

  </div>

  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /* ================= ELEMENTS ================= */

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");

    const clearButton =
      document.getElementById("clearButton");

    const themeButton =
      document.getElementById("themeButton");

    const modeSelect =
      document.getElementById("modeSelect");

    const modeStatus =
      document.getElementById("modeStatus");

    /* ================= STORAGE ================= */

    const STORAGE_KEY =
      "my-ai-chat-history";

    const MODE_KEY =
      "my-ai-mode";

    /* ================= AI MODES ================= */

    const modes = {

      general:
        "คุณเป็นผู้ช่วย AI ทั่วไป ตอบคำถามให้ชัดเจน กระชับ และเป็นประโยชน์",

      study:
        "คุณเป็นผู้ช่วยด้านการเรียน อธิบายเรื่องยากให้เข้าใจง่าย พร้อมยกตัวอย่างและสอนเป็นขั้นตอน",

      work:
        "คุณเป็นผู้ช่วยด้านการทำงาน ช่วยวางแผน วิเคราะห์งาน เขียนเอกสาร และเสนอแนวทางที่เป็นมืออาชีพ",

      data:
        "คุณเป็นผู้ช่วยวิเคราะห์ข้อมูล ช่วยวิเคราะห์ตัวเลข ตาราง ข้อมูลธุรกิจ และสรุปผลอย่างเป็นระบบ",

      writing:
        "คุณเป็นผู้ช่วยด้านการเขียน ช่วยเขียน ปรับภาษา เรียบเรียง และทำข้อความให้เหมาะกับสถานการณ์",

      ideas:
        "คุณเป็นผู้ช่วยระดมความคิด เสนอไอเดียหลายแนวทาง พร้อมข้อดีข้อควรพิจารณา",

      demo:
        "คุณอยู่ในโหมดทดลอง ตอบข้อความอย่างเป็นมิตรและสั้นกระชับ"

    };

    /* ================= MODE NAMES ================= */

    const modeNames = {

      general: "โหมดทั่วไป",

      study: "โหมดช่วยเรียน",

      work: "โหมดช่วยงาน",

      data: "โหมดวิเคราะห์ข้อมูล",

      writing: "โหมดเขียนข้อความ",

      ideas: "โหมดระดมความคิด",

      demo: "โหมดทดลอง"

    };

    /* ================= THEME ================= */

    const savedTheme =
      localStorage.getItem("my-ai-theme");

    if (savedTheme === "dark") {

      document.body.classList.add("dark");

      themeButton.textContent = "☀️";

    }

    themeButton.addEventListener(
      "click",
      function() {

        document.body.classList.toggle("dark");

        const isDark =
          document.body.classList.contains("dark");

        localStorage.setItem(
          "my-ai-theme",
          isDark ? "dark" : "light"
        );

        themeButton.textContent =
          isDark ? "☀️" : "🌙";

      }
    );

    /* ================= LOAD MODE ================= */

    const savedMode =
      localStorage.getItem(MODE_KEY);

    if (
      savedMode &&
      modes[savedMode]
    ) {

      modeSelect.value =
        savedMode;

      modeStatus.textContent =
        modeNames[savedMode];

    }

    /* ================= CHANGE MODE ================= */

    modeSelect.addEventListener(
      "change",
      function() {

        const mode =
          modeSelect.value;

        localStorage.setItem(
          MODE_KEY,
          mode
        );

        modeStatus.textContent =
          modeNames[mode];

      }
    );

    /* ================= SAVE MESSAGE ================= */

    function saveMessage(
      text,
      type
    ) {

      const history =
        JSON.parse(
          localStorage.getItem(
            STORAGE_KEY
          ) || "[]"
        );

      history.push({
        text: text,
        type: type
      });

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(history)
      );

    }

    /* ================= ADD MESSAGE ================= */

    function addMessage(
      text,
      type,
      save = true
    ) {

      if (welcome) {

        welcome.style.display =
          "none";

      }

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (
          type === "user"
            ? "user-row"
            : "ai-row"
        );

      if (type === "ai") {

        const avatar =
          document.createElement("div");

        avatar.className =
          "small-avatar";

        avatar.textContent =
          "🤖";

        row.appendChild(
          avatar
        );

      }

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent =
        text;

      row.appendChild(
        message
      );

      chat.appendChild(
        row
      );

      chat.scrollTop =
        chat.scrollHeight;

      if (save) {

        saveMessage(
          text,
          type
        );

      }

      return message;

    }

    /* ================= LOAD HISTORY ================= */

    function loadHistory() {

      const history =
        JSON.parse(
          localStorage.getItem(
            STORAGE_KEY
          ) || "[]"
        );

      if (!history.length) {

        return;

      }

      history.forEach(
        function(item) {

          addMessage(
            item.text,
            item.type,
            false
          );

        }
      );

    }

    /* ================= DEMO ================= */

    function runDemo(
      text
    ) {

      const demoReplies = [

        "🧪 นี่คือโหมดทดลองครับ ตอนนี้ระบบแชตทำงานได้โดยไม่เรียก API",

        "🤖 ระบบได้รับข้อความของคุณแล้วครับ สามารถทดลองส่งข้อความได้เลย",

        "💡 เมื่อเชื่อม API จริงในภายหลัง AI จะสามารถตอบคำถามจริงได้",

        "📚 คุณสามารถทดลองเปลี่ยนโหมด AI และส่งข้อความได้โดยไม่เสียค่า API"

      ];

      const reply =
        demoReplies[
          Math.floor(
            Math.random() *
            demoReplies.length
          )
        ];

      setTimeout(
        function() {

          addMessage(
            reply,
            "ai"
          );

          button.disabled =
            false;

          input.focus();

        },
        700
      );

    }

    /* ================= SEND MESSAGE ================= */

    async function sendMessage() {

      const text =
        input.value.trim();

      if (!text) {

        return;

      }

      const selectedMode =
        modeSelect.value;

      input.value = "";

      button.disabled = true;

      addMessage(
        text,
        "user"
      );

      /* ===== DEMO MODE ===== */

      if (
        selectedMode === "demo"
      ) {

        runDemo(text);

        return;

      }

      /* ===== AI THINKING ===== */

      const aiMessage =
        addMessage(
          "กำลังคิด... 🤔",
          "ai",
          false
        );

      try {

        const response =
          await fetch(
            "/api/chat",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  message: text,

                  mode:
                    modes[selectedMode],

                  history:
                    JSON.parse(
                      localStorage.getItem(
                        STORAGE_KEY
                      ) || "[]"
                    )

                })

            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
          );

        }

        aiMessage.textContent =
          data.reply ||
          "AI ไม่มีคำตอบ";

        saveMessage(
          aiMessage.textContent,
          "ai"
        );

      }
      catch (error) {

        console.error(
          error
        );

        aiMessage.textContent =
          "❌ " +
          error.message;

      }
      finally {

        button.disabled =
          false;

        input.focus();

      }

    }

    /* ================= SEND BUTTON ================= */

    button.addEventListener(
      "click",
      function() {

        sendMessage();

      }
    );

    /* ================= ENTER KEY ================= */

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

    /* ================= CLEAR CHAT ================= */

    clearButton.addEventListener(
      "click",
      function() {

        const confirmClear =
          confirm(
            "ต้องการล้างประวัติการสนทนาทั้งหมดหรือไม่?"
          );

        if (!confirmClear) {

          return;

        }

        localStorage.removeItem(
          STORAGE_KEY
        );

        location.reload();

      }
    );

    /* ================= START ================= */

    loadHistory();

    input.focus();

  </script>

</body>
